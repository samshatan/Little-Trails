name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LittleTrails
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LittleTrails/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export Expo web app
        run: npx expo export --platform web --output-dir dist

      - name: Configure GitHub Pages paths
        shell: bash
        run: |
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) \
            -exec sed -i 's#/_expo/#/Little-Trails/_expo/#g' {} +
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: LittleTrails/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
